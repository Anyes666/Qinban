name: QinBan Build and Core Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Generate isolated teaching library
        shell: pwsh
        run: |
          python .\tools\generate_builtin.py
          if ($LASTEXITCODE -ne 0) { throw 'Teaching generation failed' }
      - name: Build QinBan
        shell: pwsh
        run: .\build-qinban.ps1 -Mode build
      - name: Run recorder-based core tests
        shell: pwsh
        run: .\build-qinban.ps1 -Mode test

# No automatic release: full local catalogues, UserData and unreviewed assets
# must not be bundled or publicly released by a tag push.
