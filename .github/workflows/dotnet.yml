name: QinBan Build and Core Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Generate isolated teaching library
        shell: pwsh
        run: |
          python .\tools\generate_builtin.py
          if ($LASTEXITCODE -ne 0) { throw 'Teaching generation failed' }
      - name: Build QinBan
        shell: pwsh
        run: .\build-qinban.ps1 -Mode build
      - name: Run recorder-based core tests
        shell: pwsh
        run: .\build-qinban.ps1 -Mode test

# No automatic release: full local catalogues, UserData and unreviewed assets
# must not be bundled or publicly released by a tag push.
