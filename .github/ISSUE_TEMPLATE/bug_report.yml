name: 琴伴问题反馈
description: 报告琴伴的曲库、试听、界面或演奏问题。
title: '[Bug] '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请勿上传整个 UserData、凭据、私人桌面或无再分发权的商业谱。截图和错误文本请先脱敏。
  - type: input
    id: version
    attributes:
      label: 琴伴版本与来源
      placeholder: '例如：0.4.2；自行源码构建 / 本地运行包'
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Windows 版本
      options: [Windows 10, Windows 11]
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 发生在哪个环节
      options: [启动或构建, 曲库与导入, 本地试听, 演奏调校, 谱子工坊, 外观背景, 游戏快捷演奏, 其他]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤与预期结果
      description: 请说明谱格式、乐器、所选筛选和操作步骤；游戏相关问题注明目标窗口及授权状态。
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果、错误原文或脱敏截图
      description: 可在这里粘贴截图，不需要上传整个数据目录。
    validations:
      required: true
